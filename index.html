<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teste tes connaissances – GAP coaching</title>
<style>
:root{--bg:#F1F5FA;--card:#fff;--ink:#171C25;--mute:#55627a;--line:#d3dcea;--acc:#2864E8;--accbg:#e1eafc;--bad:#b4421f;--badbg:#fbe4da;--blue:#2864E8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14243B;--card:#1b2f4b;--ink:#F1F5FA;--mute:#9db0cc;--line:#2c4466;--acc:#7ea4f5;--accbg:#1f3f73;--bad:#ff9d78;--badbg:#40241a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14243B;--card:#1b2f4b;--ink:#F1F5FA;--mute:#9db0cc;--line:#2c4466;--acc:#7ea4f5;--accbg:#1f3f73;--bad:#ff9d78;--badbg:#40241a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;border-top:6px solid #2864E8;background:var(--bg);color:var(--ink);font:16px/1.55 "Barlow","Segoe UI",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:24px 16px 48px}
h1{font:800 clamp(28px,7vw,40px)/1.05 "Barlow Condensed","Arial Narrow",sans-serif;margin:0 0 14px}
h2{font:700 22px/1.2 "Barlow Condensed","Arial Narrow",sans-serif;margin:0 0 6px}
.nav{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px}
.nav button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;cursor:pointer}
.nav button[aria-current=true]{background:var(--ink);color:var(--bg);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}
.mute{color:var(--mute);font-size:14px}
label{display:block;font-weight:600;margin:10px 0 4px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
.btn{width:100%;margin-top:14px;background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:14px;font:800 17px inherit;cursor:pointer}
.opt{display:block;width:100%;text-align:left;margin-top:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:12px;font:inherit;cursor:pointer}
.opt.ok{background:var(--accbg);border-color:var(--acc)}.opt.ko{background:var(--badbg);border-color:var(--bad)}
.big{font:800 34px/1.1 "Barlow Condensed","Arial Narrow",sans-serif}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.stat{background:var(--bg);border-radius:8px;padding:10px}.stat b{display:block;font-size:22px}
.msg{background:var(--accbg);border-left:5px solid var(--acc);border-radius:8px;padding:12px 14px;margin:12px 0}
.warn{background:var(--badbg);border-left:5px solid var(--bad);border-radius:8px;padding:12px 14px;margin:10px 0}
.ck{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin:8px 0}.ck input{width:auto;margin-top:5px}
.ig{display:block;text-align:center;text-decoration:none;background:var(--blue);color:#fff;font-weight:800;border-radius:10px;padding:15px;margin-top:12px}
.bar{height:6px;background:var(--line);border-radius:4px;margin-bottom:12px}.bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
.sec{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:12px;width:100%;margin-top:10px;font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media print{.nav,.ig,.btn,.sec{display:none!important}body{background:#fff;color:#000}}
</style>
</head>
<body>
<main>
<h1>Teste tes connaissances</h1>
<div id="app"></div>
</main>
<script>

var IG = "https://ig.me/m/anthony.gapcoaching";
var app = document.getElementById("app");
function $(i){return document.getElementById(i);}
function cta(){
 return '<div class="card mute" style="margin-top:14px">Ces outils donnent des repères généraux et ne remplacent pas une analyse et une programmation approfondies. Pour des conseils vraiment adaptés à toi, consulte un coach professionnel.<a class="ig" target="_blank" rel="noopener noreferrer" href="'+IG+'">En parler avec Anthony – GAP coaching</a></div>';
}


/* 4. Mythes */
function mythes(){
 var Q=[
  ["Il faut absolument boire sa protéine dans les 30 minutes après la séance.",false,"La fenêtre est bien plus large. Ce qui compte, c’est le total de protéines sur la journée."],
  ["Les charges légères font « tonifier » sans faire grossir.",false,"Il n’existe pas de « tonification » à part. Le muscle dépend du volume, de l’effort et de l’alimentation."],
  ["Le muscle se transforme en graisse quand on arrête de s’entraîner.",false,"Ce sont deux tissus différents. Le muscle diminue, la graisse peut augmenter si on mange autant."],
  ["Des charges modérées peuvent faire progresser si les séries sont proches de l’échec.",true,"Oui, l’effort proche de l’échec compte plus que la charge seule."],
  ["Il faut avoir des courbatures pour savoir que la séance était efficace.",false,"Les courbatures ne sont pas un indicateur fiable de progression."],
  ["Le sommeil influence directement tes progrès en musculation.",true,"Oui, il joue sur la récupération, l’énergie et l’appétit."],
  ["Faire beaucoup d’abdos fait perdre le gras du ventre.",false,"On ne choisit pas où l’on perd du gras. Le déficit calorique global décide."],
  ["La surcharge progressive est le moteur principal de la progression.",true,"Oui, augmenter progressivement la difficulté est la base du développement musculaire."],
  ["À volume égal, répartir le travail d’un muscle sur 2 à 3 séances par semaine est en général au moins aussi efficace qu’une seule grosse séance.",true,"Oui : une fréquence plus élevée répartit l’effort, limite la fatigue par séance et facilite la récupération entre les séries."],
  ["Travailler en grande amplitude, avec étirement sous charge, stimule moins la croissance qu’un mouvement partiel avec une charge plus lourde.",false,"Faux : les études suggèrent que la grande amplitude, surtout en position étirée, est au moins aussi efficace, voire meilleure."]
 ],i=0,sc=0;
 (function show(){
  app.innerHTML='<section class="card"><div class="bar"><i style="width:'+(i/Q.length*100)+'%"></i></div><div class="mute">Affirmation '+(i+1)+' sur '+Q.length+'</div><h2>'+Q[i][0]+'</h2><button class="opt" data-v="1">Vrai</button><button class="opt" data-v="0">Faux</button><div id="fb"></div></section>';
  document.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){
   var ok=(b.dataset.v==="1")===Q[i][1]; if(ok)sc++;
   document.querySelectorAll(".opt").forEach(function(x){x.disabled=true;});
   b.classList.add(ok?"ok":"ko");
   $("fb").innerHTML='<div class="'+(ok?"msg":"warn")+'"><b>'+(ok?"Exact !":"Pas tout à fait.")+'</b> '+Q[i][2]+'</div><button class="btn" id="nx">'+(i<Q.length-1?"Suivant":"Voir mon score")+'</button>';
   $("nx").onclick=function(){i++;if(i<Q.length)show();else end();};
  };});
 })();
 function end(){
  var m=sc>=8?"Tu es incollable !":sc>=5?"Pas mal, quelques idées reçues à corriger.":"Il reste des mythes à démonter, et c’est normal.";
  app.innerHTML='<section class="card"><div class="mute">Ton score</div><div class="big">'+sc+' sur '+Q.length+'</div><div class="msg">'+m+'</div><button class="btn" id="sh">Partager mon score</button><p class="mute" id="shm"></p></section>'+cta();
  $("sh").onclick=function(){
   var txt="J’ai eu "+sc+"/"+Q.length+" au quiz mythes et réalités de la muscu. Et toi ?";
   try{
    if(navigator.share){navigator.share({text:txt,url:location.href.split("#")[0]});}
    else{navigator.clipboard.writeText(txt+" "+location.href);$("shm").textContent="Texte copié, colle-le où tu veux.";}
   }catch(e){$("shm").textContent=txt;}
  };
 }
}


mythes();
</script>
</body>
</html>
